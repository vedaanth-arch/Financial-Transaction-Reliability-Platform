# Spring Boot loads this local Java-properties-format file only in the db profile.
# Keep .env.local untracked and do not commit database credentials.
spring.config.import=optional:file:.env.local[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/financial_transaction_platform}
spring.datasource.username=${DB_USERNAME:financial_app}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.data.jpa.repositories.enabled=true
